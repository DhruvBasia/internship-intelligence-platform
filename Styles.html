<style>
/* 
 * Styles.css
 * Premium Glassmorphic Design System (Notion/Linear/Apple inspired)
 * Supporting Dark/Light themes dynamically.
 */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap');

:root {
  /* Dark Mode Variables (Default) */
  --bg-gradient: radial-gradient(circle at 50% 0%, #1a1528 0%, #0d0a14 100%);
  --panel-bg: rgba(22, 17, 36, 0.65);
  --panel-border: rgba(255, 255, 255, 0.08);
  --text-primary: #f3f0f7;
  --text-secondary: #a39bb8;
  --text-muted: #6e6582;
  --accent-primary: #8a2be2; /* Violet */
  --accent-secondary: #00f2fe; /* Cyan */
  --accent-gradient: linear-gradient(135deg, #8a2be2 0%, #4a00e0 100%);
  --accent-gradient-glow: linear-gradient(135deg, rgba(138, 43, 226, 0.3) 0%, rgba(74, 0, 224, 0.3) 100%);
  --success: #00e676;
  --warning: #ffb300;
  --danger: #ff1744;
  --info: #2979ff;
  --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
  --card-bg-hover: rgba(255, 255, 255, 0.03);
  
  /* Status Lane Colors */
  --lane-discovered: rgba(142, 68, 173, 0.15);
  --lane-applied: rgba(41, 128, 185, 0.15);
  --lane-interviewing: rgba(243, 156, 18, 0.15);
  --lane-offered: rgba(39, 174, 96, 0.15);
  --lane-rejected: rgba(192, 57, 43, 0.15);
  --lane-archived: rgba(127, 140, 141, 0.15);
  
  --font-title: 'Outfit', sans-serif;
  --font-body: 'Inter', sans-serif;
}

[data-theme="light"] {
  /* Light Mode Variables */
  --bg-gradient: radial-gradient(circle at 50% 0%, #f4f6fa 0%, #e2e8f0 100%);
  --panel-bg: rgba(255, 255, 255, 0.7);
  --panel-border: rgba(0, 0, 0, 0.08);
  --text-primary: #1e1b29;
  --text-secondary: #625c73;
  --text-muted: #8c859e;
  --accent-primary: #6c5ce7;
  --accent-secondary: #00b894;
  --accent-gradient: linear-gradient(135deg, #6c5ce7 0%, #a862ea 100%);
  --accent-gradient-glow: linear-gradient(135deg, rgba(108, 92, 231, 0.15) 0%, rgba(168, 98, 234, 0.15) 100%);
  --success: #2ecc71;
  --warning: #f1c40f;
  --danger: #e74c3c;
  --info: #3498db;
  --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
  --card-bg-hover: rgba(0, 0, 0, 0.02);
  
  --lane-discovered: rgba(142, 68, 173, 0.08);
  --lane-applied: rgba(41, 128, 185, 0.08);
  --lane-interviewing: rgba(243, 156, 18, 0.08);
  --lane-offered: rgba(39, 174, 96, 0.08);
  --lane-rejected: rgba(192, 57, 43, 0.08);
  --lane-archived: rgba(127, 140, 141, 0.08);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
}

body {
  font-family: var(--font-body);
  background: var(--bg-gradient);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  overflow-x: hidden;
}

/* Scrollbar styling */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: rgba(0, 0, 0, 0.05);
}
::-webkit-scrollbar-thumb {
  background: rgba(138, 43, 226, 0.2);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: rgba(138, 43, 226, 0.5);
}

/* Glassmorphism Styles */
.glass-panel {
  background: var(--panel-bg);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  border: 1px solid var(--panel-border);
  box-shadow: var(--shadow);
  border-radius: 16px;
}

.glass-card {
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid var(--panel-border);
  border-radius: 12px;
  padding: 16px;
  transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
}
.glass-card:hover {
  transform: translateY(-2px);
  background: var(--card-bg-hover);
  box-shadow: 0 8px 24px rgba(0,0,0,0.15);
}

.glass-input {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  padding: 10px 14px;
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 14px;
  outline: none;
  width: 100%;
}
.glass-input:focus {
  border-color: var(--accent-primary);
  background: rgba(255, 255, 255, 0.07);
  box-shadow: 0 0 0 3px rgba(138, 43, 226, 0.2);
}

.glass-btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--panel-border);
  color: var(--text-primary);
  padding: 10px 18px;
  border-radius: 8px;
  cursor: pointer;
  font-family: var(--font-body);
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: background-color 0.2s ease, border-color 0.2s ease;
}
.glass-btn:hover {
  background: rgba(255, 255, 255, 0.1);
  border-color: var(--text-secondary);
}
.glass-btn.primary {
  background: var(--accent-gradient);
  border: none;
  color: white;
}
.glass-btn.primary:hover {
  filter: brightness(1.1);
}
.glass-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* Page Layout */
.app-container {
  display: flex;
  width: 100%;
  max-width: 1600px;
  margin: auto;
  height: 100vh;
  padding: 16px;
  gap: 16px;
}

/* Sidebar Navigation */
.sidebar {
  width: 260px;
  display: flex;
  flex-direction: column;
  padding: 24px;
  flex-shrink: 0;
  height: 100%;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 36px;
}
.brand-logo {
  width: 32px;
  height: 32px;
  background: var(--accent-gradient);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  color: white;
  font-size: 16px;
}
.brand-name {
  font-family: var(--font-title);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.menu-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.menu-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: 10px;
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 500;
  transition: all 0.2s ease;
}
.menu-item:hover, .menu-item.active {
  color: var(--text-primary);
  background: rgba(255, 255, 255, 0.05);
}
.menu-item.active {
  border-left: 3px solid var(--accent-primary);
  background: rgba(138, 43, 226, 0.1);
}

.sidebar-footer {
  margin-top: auto;
  padding-top: 24px;
  border-top: 1px solid var(--panel-border);
}

.theme-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.1);
  font-size: 13px;
  color: var(--text-secondary);
}

/* Main Content Area */
.main-content {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  height: 100%;
}

.navbar {
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  border-bottom: 1px solid var(--panel-border);
  flex-shrink: 0;
}
.nav-title {
  font-family: var(--font-title);
  font-size: 22px;
  font-weight: 700;
}
.nav-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.view-container {
  flex-grow: 1;
  overflow-y: auto;
  padding: 24px;
}

.view-pane {
  display: none;
  animation: fadeIn 0.3s ease;
}
.view-pane.active {
  display: block;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Dashboard Analytics Grid */
.dashboard-metrics {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.metric-card {
  padding: 20px;
}
.metric-title {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.metric-value {
  font-family: var(--font-title);
  font-size: 32px;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1;
}
.metric-trend {
  font-size: 12px;
  margin-top: 8px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.metric-trend.up { color: var(--success); }
.metric-trend.down { color: var(--danger); }

.dashboard-charts {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 16px;
  margin-bottom: 24px;
}
@media (max-width: 900px) {
  .dashboard-charts {
    grid-template-columns: 1fr;
  }
}
.chart-card {
  height: 350px;
  display: flex;
  flex-direction: column;
}
.chart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.chart-container {
  position: relative;
  flex-grow: 1;
  width: 100%;
  height: 100%;
}

.dashboard-subgrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
@media (max-width: 900px) {
  .dashboard-subgrid {
    grid-template-columns: 1fr;
  }
}

/* Kanban Board Layout */
.kanban-board {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  height: calc(100vh - 180px);
  overflow-x: auto;
  align-items: start;
}
@media (max-width: 1100px) {
  .kanban-board {
    grid-template-columns: repeat(5, 280px);
  }
}

.kanban-column {
  border-radius: 12px;
  padding: 12px;
  height: 100%;
  display: flex;
  flex-direction: column;
  max-height: 100%;
  transition: border-color 0.2s ease;
}
.kanban-column.discovered { background: var(--lane-discovered); }
.kanban-column.applied { background: var(--lane-applied); }
.kanban-column.interviewing { background: var(--lane-interviewing); }
.kanban-column.offered { background: var(--lane-offered); }
.kanban-column.rejected { background: var(--lane-rejected); }

.kanban-column-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  padding: 4px;
}
.kanban-column-title {
  font-family: var(--font-title);
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
}
.kanban-card-count {
  font-size: 12px;
  background: rgba(0, 0, 0, 0.2);
  padding: 2px 8px;
  border-radius: 10px;
  color: var(--text-secondary);
}

.kanban-cards-container {
  flex-grow: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-bottom: 40px;
}
.kanban-column.dragover {
  outline: 2px dashed var(--accent-primary);
  outline-offset: -2px;
}

.kanban-card {
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 10px;
  padding: 14px;
  cursor: grab;
  position: relative;
  transition: transform 0.2s ease, border-color 0.2s ease;
}
.kanban-card:hover {
  transform: translateY(-2px);
  border-color: rgba(255,255,255,0.15);
}
.kanban-card:active {
  cursor: grabbing;
}
.kanban-card-company {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-bottom: 4px;
}
.kanban-card-role {
  font-family: var(--font-title);
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 8px;
  line-height: 1.2;
}
.kanban-card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
}
.match-score-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
  color: white;
}
.match-score-badge.high { background: var(--success); }
.match-score-badge.medium { background: var(--warning); color: #1e1b29; }
.match-score-badge.low { background: var(--danger); }

/* Table View Grid Styles */
.table-view-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  gap: 16px;
}
.search-wrapper {
  position: relative;
  flex-grow: 1;
  max-width: 400px;
}
.table-wrapper {
  overflow-x: auto;
  border-radius: 12px;
  border: 1px solid var(--panel-border);
}
.data-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 14px;
}
.data-table th {
  background: rgba(0,0,0,0.2);
  color: var(--text-secondary);
  font-weight: 600;
  padding: 12px 16px;
  border-bottom: 1px solid var(--panel-border);
  cursor: pointer;
  user-select: none;
}
.data-table th:hover {
  color: var(--text-primary);
}
.data-table td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--panel-border);
  color: var(--text-primary);
}
.data-table tr:hover {
  background: var(--card-bg-hover);
}

.status-indicator {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 20px;
}
.status-indicator::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.status-indicator.Discovered { color: #9b59b6; background: rgba(155, 89, 182, 0.15); }
.status-indicator.Applied { color: #3498db; background: rgba(52, 152, 219, 0.15); }
.status-indicator.Interviewing { color: #e67e22; background: rgba(230, 126, 34, 0.15); }
.status-indicator.Offered { color: #2ecc71; background: rgba(46, 204, 113, 0.15); }
.status-indicator.Rejected { color: #e74c3c; background: rgba(231, 76, 60, 0.15); }
.status-indicator.Archived { color: #95a5a6; background: rgba(149, 165, 166, 0.15); }

/* SOP & AI View Details */
.sop-generator-layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
@media (max-width: 900px) {
  .sop-generator-layout {
    grid-template-columns: 1fr;
  }
}

.sop-sidebar {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.sop-editor {
  display: flex;
  flex-direction: column;
  gap: 16px;
  height: calc(100vh - 200px);
}
.editor-textarea {
  flex-grow: 1;
  resize: none;
  font-family: 'Courier New', Courier, monospace;
  font-size: 14px;
  line-height: 1.5;
  background: rgba(0, 0, 0, 0.1);
}

/* Modals & Popups */
.modal-backdrop {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  animation: fadeIn 0.2s ease;
}
.modal-backdrop.active {
  display: flex;
}
.modal-content {
  width: 100%;
  max-width: 650px;
  max-height: 85vh;
  overflow-y: auto;
  border-radius: 16px;
  padding: 28px;
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--panel-border);
}
.modal-close {
  cursor: pointer;
  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 20px;
}
.modal-close:hover {
  color: var(--text-primary);
}

.form-group {
  margin-bottom: 16px;
}
.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

/* Toast Notifications */
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 2000;
}
.toast {
  padding: 14px 20px;
  border-radius: 8px;
  background: var(--panel-bg);
  backdrop-filter: blur(10px);
  border: 1px solid var(--panel-border);
  box-shadow: var(--shadow);
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 10px;
  animation: slideIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.toast.success { border-left: 4px solid var(--success); }
.toast.error { border-left: 4px solid var(--danger); }
.toast.info { border-left: 4px solid var(--info); }

@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* Activity Logger widget */
.activity-stream {
  max-height: 250px;
  overflow-y: auto;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-right: 4px;
}
.activity-item {
  padding: 10px;
  border-bottom: 1px solid var(--panel-border);
  font-size: 13px;
}
.activity-meta {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}

/* Skeleton Loading Screens */
.skeleton-loader {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.skeleton-bar {
  background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
  background-size: 200% 100%;
  animation: loadingSkeleton 1.5s infinite;
  border-radius: 4px;
  height: 20px;
  width: 100%;
}
@keyframes loadingSkeleton {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

.job-card-details-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 16px;
}

.markdown-preview {
  padding: 12px;
  background: rgba(0,0,0,0.15);
  border-radius: 8px;
  border: 1px solid var(--panel-border);
  min-height: 120px;
  font-size: 13px;
  line-height: 1.5;
  white-space: pre-wrap;
}

</style>
