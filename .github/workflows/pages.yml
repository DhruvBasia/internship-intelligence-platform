name: Publish web app

# Builds the static site with the public settings in deploy/public.json and
# publishes it to the gh-pages branch, which GitHub Pages serves
# (Settings → Pages → Deploy from a branch → gh-pages). The server (Supabase)
# is deployed separately with `npm run deploy:server`.

on:
  push:
    branches: [main, v3]
    paths: ['src/**', 'deploy/public.json', 'scripts/build.mjs', 'package*.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/build.mjs --public
      - run: touch dist/web/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/web
          clean: true
